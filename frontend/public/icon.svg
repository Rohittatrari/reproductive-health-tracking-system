<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle rounded background for home screen icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Lotus / Flower / Health Symbol -->
  <g transform="translate(256, 270) scale(1.15)">
    <!-- Central Petal -->
    <path d="M 0 -130 C 50 -60 60 40 0 80 C -60 40 -50 -60 0 -130 Z" fill="url(#petalGrad)" opacity="0.95" />

    <!-- Left Petal -->
    <path d="M 0 70 C -70 50 -130 -10 -110 -80 C -70 -50 -30 20 0 70 Z" fill="url(#petalGrad)" opacity="0.85" />

    <!-- Right Petal -->
    <path d="M 0 70 C 70 50 130 -10 110 -80 C 70 -50 30 20 0 70 Z" fill="url(#petalGrad)" opacity="0.85" />

    <!-- Outer Left Wing -->
    <path d="M 0 75 C -90 85 -160 40 -150 -20 C -110 0 -50 45 0 75 Z" fill="url(#petalGrad)" opacity="0.7" />

    <!-- Outer Right Wing -->
    <path d="M 0 75 C 90 85 160 40 150 -20 C 110 0 50 45 0 75 Z" fill="url(#petalGrad)" opacity="0.7" />

    <!-- Core glowing spark / drop -->
    <circle cx="0" cy="20" r="14" fill="#f43f5e" filter="url(#glow)" />
  </g>

  <!-- Sparkle top-right -->
  <g transform="translate(390, 115) scale(0.65)" fill="#ffffff">
    <path d="M 0 -40 Q 0 0 40 0 Q 0 0 0 40 Q 0 0 -40 0 Q 0 0 0 -40 Z" />
  </g>
</svg>
