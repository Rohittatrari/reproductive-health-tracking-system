<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AuraHealth • Reproductive Health Tracking System</title>
    <meta name="description" content="Modern, secure, and intuitive reproductive health tracking, menstrual cycle analytics, and fertility awareness system." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AuraHealth" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#faf7fd] text-purple-950 antialiased selection:bg-purple-200 selection:text-purple-900">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('AuraHealth Service Worker registered successfully', reg.scope))
            .catch((err) => console.log('Service Worker registration skipped or failed:', err));
        });
      }
    </script>
  </body>
</html>
