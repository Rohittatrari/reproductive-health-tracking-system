version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reproductive_health_db
    environment:
      POSTGRES_DB: reproductive_health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reproductive_health_api
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/reproductive_health
      SECRET_KEY: reproductive-health-super-secret-jwt-key-2026-secure-random
      API_V1_STR: /api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: always

volumes:
  pgdata:
